services:
  hermes-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-trader
    volumes:
      - .env.local:/app/.env.local:ro
      - .agent-config.json:/app/.agent-config.json:ro
      - ./trader-logs:/app/log:rw
    env_file:
      - .env.local
    networks:
      - llama-net
    restart: unless-stopped

networks:
  llama-net:
    external: true
