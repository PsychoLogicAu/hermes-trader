[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-trader"
version = "1.0.0"
description = "Hyperliquid trading engine"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
    "pyfiglet>=1.0.2",
    "certifi>=2023.5.0",
    "eth-account>=0.8.0",
    "hyperliquid-python-sdk>=0.24.0",
    "httpcore>=1.0.0",
    # Optional shadow signal: Chronos-2 forecasting (lazy-imported; the bot
    # runs fine without it — the signal just stays disabled).
    "chronos-forecasting>=2.0,<3",
]

[project.optional-dependencies]
# Dashboard + operator console (python -m hermes_trader.server).
dashboard = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "prometheus-client>=0.26",
]
# Offline test suite (CI installs this).
dev = [
    "pytest>=9.0",
    "hermes-trader[dashboard]",
]

[tool.setuptools.packages.find]
include = ["hermes_trader"]
